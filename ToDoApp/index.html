<!DOCTYPE html>
<html lang="en">
<head>

  <title>Increaser Decreaser</title>
  <link rel="stylesheet" href="style.css"> 
</head>
<body>

  <div id="app" style="height: 300px; margin: 20px;">
    <div id="title">
      <div id="task-title">Tasks:</div>

<input id="myInput" type="text" style="width: 300px; height: 20px;"> 
  <button id="add">add task</button>
  
  <script src="script.js"></script>
